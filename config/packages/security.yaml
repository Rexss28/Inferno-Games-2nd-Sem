security:
    password_hashers:
        App\Entity\User:
            algorithm: auto
    
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username
    
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        google_auth:
            pattern: ^/api/auth/google
            stateless: true
            custom_authenticator: App\Security\GoogleAuthenticator

        staff_google:
            pattern: ^/staff/google
            stateless: false
            context: main  # Share session with main firewall
            custom_authenticator: App\Security\StaffGoogleAuthenticator
            logout:
                path: app_logout
                target: app_login
        
        api_login:
            pattern: ^/api/login
            stateless: true
            json_login:
                check_path: /api/login
                # username_path: email
                username_path: username
                password_path: password
                success_handler: App\Security\JWTAuthenticationSuccessHandler
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
        
        api:
            pattern: ^/api
            stateless: true
            jwt: ~
        
        main:
            lazy: true
            provider: app_user_provider
            context: main  # Share session with staff_google
            custom_authenticators:  # <-- FIXED: Added 's' and array syntax
                - App\Security\LoginAuthenticator
            logout:
                path: app_logout

    role_hierarchy:
        ROLE_ADMIN: [ROLE_STAFF, ROLE_USER]

    access_control:
    # API Platform UI routes
    - { path: ^/api/docs, roles: PUBLIC_ACCESS }
    - { path: ^/api/contexts, roles: PUBLIC_ACCESS }
    - { path: ^/api/graphql, roles: PUBLIC_ACCESS }
    - { path: ^/api/.jsonld, roles: PUBLIC_ACCESS }

    # PUBLIC API ROUTES
    - { path: ^/api/register, roles: PUBLIC_ACCESS }
    - { path: ^/api/verify-email, roles: PUBLIC_ACCESS }
    - { path: ^/api/login, roles: PUBLIC_ACCESS }
    - { path: ^/api/auth/google, roles: PUBLIC_ACCESS }
    - { path: ^/api/games, roles: PUBLIC_ACCESS }
    
    # PROTECTED API ROUTES (Remove the catch-all PUBLIC_ACCESS for /api/orders)
    - { path: ^/api/cart, roles: IS_AUTHENTICATED_FULLY }
    - { path: ^/api/customer, roles: IS_AUTHENTICATED_FULLY }
    - { path: ^/api/orders, roles: IS_AUTHENTICATED_FULLY }
    - { path: ^/api/orders/, roles: IS_AUTHENTICATED_FULLY }
    
    # ADMIN/STAFF ROUTES
    - { path: ^/staff/google, roles: PUBLIC_ACCESS }
    - { path: ^/admin/analytics, roles: ROLE_STAFF }
    - { path: ^/admin/games, roles: ROLE_STAFF }
    - { path: ^/admin/stocks, roles: ROLE_STAFF }
    - { path: ^/admin/license-keys, roles: ROLE_STAFF }
    - { path: ^/admin/orders, roles: ROLE_STAFF }
    - { path: ^/admin, roles: ROLE_ADMIN }
    - { path: ^/activity-logs, roles: ROLE_ADMIN }
    
    # WEB ROUTES
    - { path: ^/login$, roles: PUBLIC_ACCESS }
    - { path: ^/logout$, roles: IS_AUTHENTICATED_FULLY }
    - { path: ^/profile, roles: IS_AUTHENTICATED_FULLY }
    - { path: ^/verify-email, roles: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10