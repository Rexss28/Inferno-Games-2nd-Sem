version: '3.8'

services:
  # Symfony Web Application
  web:
    build: .
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    ports:
      - "8000:80"  # Important: Use port 8000 for ngrok
    depends_on:
      - mysql
    networks:
      - inferno_network
    environment:
      # Use the split parameters here too instead of a hardcoded string!
      MYSQLUSER: ${MYSQLUSER}
      MYSQLPASSWORD: ${MYSQLPASSWORD}
      MYSQLHOST: mysql
      MYSQLPORT: 3306
      MYSQLDATABASE: ${MYSQLDATABASE}

  # MySQL Database
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      # Fixed Indentation Here!
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQLDATABASE}
      MYSQL_USER: ${MYSQLUSER}
      MYSQL_PASSWORD: ${MYSQLPASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - inferno_network
    command: --default-authentication-plugin=mysql_native_password

  # PHPMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${MYSQLUSER}
      PMA_PASSWORD: ${MYSQLPASSWORD}
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - inferno_network

volumes:
  mysql_data:

networks:
  inferno_network:
    driver: bridge