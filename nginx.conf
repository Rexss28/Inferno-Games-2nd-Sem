server {
    listen 80 default_server;
    root /app/public;
    index index.php;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Main application
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # PHP-FPM handler
    location ~ ^/index\.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        
        # Core Symfony execution configs
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        # --- CRITICAL RAILWAY PROXY HEADERS START ---
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param Insight-Public-IP $remote_addr;
        
        # Pass proxy headers down to Symfony's Trusted Proxies component
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_PORT $http_x_forwarded_port;
        # --- CRITICAL RAILWAY PROXY HEADERS END ---

        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}